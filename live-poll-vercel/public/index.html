<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vote: what ruins a service?</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#12336b;color:#f2f6ff;font:17px/1.5 system-ui,sans-serif;padding:clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:18px}h1{font-size:clamp(28px,5vw,52px);line-height:1.05;max-width:20ch}.sub{color:#a4b8df}button{font:inherit;color:inherit;cursor:pointer;background:rgba(13,39,87,.8);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:14px 16px;text-align:left}button:hover,button.on{border-color:#ffd23f}button.on{background:rgba(255,210,63,.18)}button:disabled{opacity:.5;cursor:default}.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.pri{background:#ffd23f;color:#10203f;font-weight:600;border-color:#ffd23f}.bar{height:10px;background:#ffd23f;border-radius:3px;transition:width .4s}.row{display:grid;gap:4px}.top{display:flex;justify-content:space-between;gap:12px}.big{font-size:clamp(48px,9vw,96px);font-weight:800;line-height:1}.btns{display:flex;gap:10px;flex-wrap:wrap}.btns button{text-align:center}</style></head><body>
<h1>What ruins a service for you?</h1>
<p class="sub" id="msg">Tap the one that annoys you most. You can change your vote until voting closes.</p><div class="grid" id="g"></div>
<script>
const g=document.getElementById('g'),msg=document.getElementById('msg');let mine=null,open=true,opts=[];
function draw(){g.innerHTML='';opts.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.className=i===mine?'on':'';b.disabled=!open;b.onclick=()=>vote(i);g.append(b)})}
async function vote(i){try{const r=await fetch('/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({i})});const d=await r.json();
 if(d.ok){mine=i;msg.textContent='Vote recorded. Tap another option to change it.'}else{msg.textContent=d.error||'Something went wrong. Try again.';if(d.error==='Voting is closed.')open=false}}catch{msg.textContent='Network problem. Try again.'}draw()}
fetch('/api/state').then(r=>r.json()).then(s=>{if(s.error){msg.textContent=s.error;return}opts=s.options;mine=s.mine;open=s.open;if(!open)msg.textContent='Voting is closed.';draw()}).catch(()=>{msg.textContent='Could not load the poll.'});
</script></body></html>
