<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin results</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#12336b;color:#f2f6ff;font:17px/1.5 system-ui,sans-serif;padding:clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:18px}h1{font-size:clamp(28px,5vw,52px);line-height:1.05;max-width:20ch}.sub{color:#a4b8df}button{font:inherit;color:inherit;cursor:pointer;background:rgba(13,39,87,.8);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:14px 16px;text-align:left}button:hover,button.on{border-color:#ffd23f}button.on{background:rgba(255,210,63,.18)}button:disabled{opacity:.5;cursor:default}.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.pri{background:#ffd23f;color:#10203f;font-weight:600;border-color:#ffd23f}.bar{height:10px;background:#ffd23f;border-radius:3px;transition:width .4s}.row{display:grid;gap:4px}.top{display:flex;justify-content:space-between;gap:12px}.big{font-size:clamp(48px,9vw,96px);font-weight:800;line-height:1}.btns{display:flex;gap:10px;flex-wrap:wrap}.btns button{text-align:center}</style></head><body>
<div class="top"><div><p class="sub">Total votes</p><div class="big" id="tot">0</div></div><div class="sub" id="st">Loading…</div></div>
<div class="btns"><button id="tg" class="pri">Close voting</button><button id="rs">Reset all votes</button></div>
<p class="sub">Share this link with voters: <b id="lnk"></b></p><div class="grid" id="res" style="grid-template-columns:1fr;max-width:900px"></div>
<script>
const K=new URLSearchParams(location.search).get('key')||'',$=id=>document.getElementById(id);$('lnk').textContent=location.origin;
function render(d){$('tot').textContent=d.total;$('st').textContent=d.open?'Voting is open':'Voting is closed';$('tg').textContent=d.open?'Close voting':'Reopen voting';
 const max=Math.max(1,...d.counts),res=$('res');res.innerHTML='';
 d.options.map((t,i)=>({t,c:d.counts[i]})).sort((a,b)=>b.c-a.c).forEach(x=>{const r=document.createElement('div');r.className='row';
  const top=document.createElement('div');top.className='top';const a=document.createElement('span'),b=document.createElement('b');
  a.textContent=x.t;b.textContent=x.c+(d.total?' ('+Math.round(100*x.c/d.total)+'%)':'');top.append(a,b);
  const bar=document.createElement('div');bar.className='bar';bar.style.width=(100*x.c/max)+'%';r.append(top,bar);res.append(r)})}
async function call(body){try{const r=await fetch('/api/admin?key='+encodeURIComponent(K),body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();
 if(d.error){$('st').textContent=d.error;return}render(d)}catch{$('st').textContent='Network problem, retrying…'}}
$('tg').onclick=()=>call({action:'toggle'});$('rs').onclick=()=>{if(confirm('Delete all votes?'))call({action:'reset'})};
call();setInterval(()=>call(),2000);   // refresh every 2 seconds
</script></body></html>
